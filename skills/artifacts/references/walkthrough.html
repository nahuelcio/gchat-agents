<section class="art">
  <header>
    <p class="eyebrow">{{EYEBROW}}</p>
    <h1>{{TITLE}}</h1>
    <p class="lead">{{LEAD}}</p>
  </header>
  <ol class="steps">
    <li class="panel">
      <h2>{{STEP1_TITLE}}</h2>
      <p>{{STEP1_BODY}}</p>
    </li>
    <li class="panel">
      <h2>{{STEP2_TITLE}}</h2>
      <p>{{STEP2_BODY}}</p>
    </li>
    <li class="panel">
      <h2>{{STEP3_TITLE}}</h2>
      <p>{{STEP3_BODY}}</p>
    </li>
  </ol>
  <p class="foot mono">{{FOOTNOTE}}</p>
</section>
<style>
:root {
  --bg: #fafaf7; --surface: #ffffff; --ink: #1a1a1f; --ink-soft: #555560; --rule: #e7e5df;
  --accent: #2f5d8a; --accent-soft: #eaf0f6; --ok: #15803d; --bad: #b91c1c;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e12; --surface: #16161c; --ink: #f1f1f4; --ink-soft: #a8a8b3; --rule: #2a2a32;
    --accent: #8fb4dc; --accent-soft: #1a2430; --ok: #4ade80; --bad: #f87171; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e12; --surface: #16161c; --ink: #f1f1f4; --ink-soft: #a8a8b3; --rule: #2a2a32;
  --accent: #8fb4dc; --accent-soft: #1a2430; --ok: #4ade80; --bad: #f87171; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px; font: 15px/1.55 var(--sans); color: var(--ink); background: var(--bg); }
.art { max-width: 46rem; margin: 0 auto; }
.eyebrow { margin: 0 0 6px; font: 600 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.art h1 { margin: 0 0 8px; font-size: 1.75rem; line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
.lead { margin: 0 0 20px; color: var(--ink-soft); max-width: 65ch; }
.art h2 { margin: 0 0 6px; font-size: 1.05rem; line-height: 1.3; }
.art p { margin: 0; }
.panel { min-width: 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }
.grid, .cards { display: grid; gap: 12px; }
.grid { grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
.cards { grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); }
.panel-cyan, .panel-amber { border-top: 3px solid var(--accent); }
ul { margin: 0; padding-left: 1.2em; } li { margin: 4px 0; }
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 10px; }
.steps > li { counter-increment: s; display: grid; grid-template-columns: 2rem 1fr; column-gap: 8px; margin: 0; }
.steps > li::before { content: counter(s); grid-row: span 2; font: 600 1.1rem/1.3 var(--mono); color: var(--accent); }
.foot, .chip-note { margin-top: 16px; font-size: 13px; color: var(--ink-soft); }
.chip-note { padding: 10px 12px; background: var(--accent-soft); border-radius: 6px; color: var(--ink); }
.mono { font-family: var(--mono); }
.q { margin-bottom: 12px; display: grid; gap: 8px; }
.prompt { font-weight: 600; }
.q button { font: inherit; text-align: left; padding: 8px 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; }
.q button:hover:not(:disabled) { border-color: var(--accent); }
.q button:disabled { cursor: default; }
.q button.ok { border-color: var(--ok); box-shadow: inset 3px 0 0 var(--ok); }
.q button.bad { border-color: var(--bad); box-shadow: inset 3px 0 0 var(--bad); }
.feedback { font-size: 13px; color: var(--ink-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
