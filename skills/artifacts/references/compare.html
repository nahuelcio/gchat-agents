<section class="art">
  <header>
    <p class="eyebrow">Compare</p>
    <h1>{{TITLE}}</h1>
    <p class="lead">{{LEAD}}</p>
  </header>
  <div class="grid">
    <article class="panel">
      <h2>{{A_TITLE}}</h2>
      <ul>
        <li>{{A1}}</li>
        <li>{{A2}}</li>
        <li>{{A3}}</li>
      </ul>
    </article>
    <article class="panel panel-cyan">
      <h2>{{B_TITLE}}</h2>
      <ul>
        <li>{{B1}}</li>
        <li>{{B2}}</li>
        <li>{{B3}}</li>
      </ul>
    </article>
  </div>
  <p class="chip-note"><strong>Cuándo elegir:</strong> {{PICK_HINT}}</p>
</section>
<style>
@import url("https://fonts.googleapis.com/css2?family=Bangers&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap");
:root {
  --primary: #1c202b; --secondary: #7107e7; --surface: #f6f7f9; --panel: #fff;
  --fg: #2b2f38; --muted: #6b7280; --accent-ink: #5a06b8; --accent-soft: #f1eafd; --cyan: #22d3ee;
  --radius-sm: 4px; --radius-md: 8px;
  --font-display: "Bangers", system-ui, sans-serif;
  --font-ui: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; padding: 20px; min-height: 100%;
  font: 14px/1.55 var(--font-ui); color: var(--fg);
  background:
    radial-gradient(ellipse 80% 50% at 0% 0%, color-mix(in srgb, var(--secondary) 18%, transparent), transparent 55%),
    radial-gradient(ellipse 60% 40% at 100% 100%, color-mix(in srgb, var(--cyan) 14%, transparent), transparent 50%),
    var(--surface);
}
.art { max-width: 48rem; margin: 0 auto; }
.eyebrow { margin: 0 0 6px; font: 600 11px/1.2 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
.art h1 {
  margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 2rem;
  line-height: 1.05; letter-spacing: .04em; text-transform: uppercase; color: var(--primary);
}
.lead { margin: 0 0 18px; color: var(--muted); font-size: 1rem; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
.panel {
  padding: 14px 16px; background: var(--panel); border: 2px solid var(--primary);
  border-radius: var(--radius-md); box-shadow: 4px 4px 0 color-mix(in srgb, var(--secondary) 55%, transparent);
}
.panel-cyan { box-shadow: 4px 4px 0 color-mix(in srgb, var(--cyan) 65%, transparent); }
.art h2 { margin: 0 0 8px; font: 600 1.05rem/1.3 var(--font-ui); color: var(--primary); text-transform: none; letter-spacing: 0; }
ul { margin: 0; padding-left: 1.2em; }
li { margin: 4px 0; }
.chip-note {
  margin: 14px 0 0; padding: 10px 12px; background: var(--accent-soft);
  border: 2px solid var(--secondary); border-radius: var(--radius-sm);
  box-shadow: 2px 2px 0 var(--primary); font-size: 13px;
}
</style>
