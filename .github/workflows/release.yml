name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["rust/**", "web/**", "skills/**", ".agents/skills/**", "package-lock.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: switchboard-windows-x64.exe, bin: switchboard.exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: switchboard-linux-x64, bin: switchboard }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: switchboard-linux-arm64, bin: switchboard }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked --manifest-path rust/Cargo.toml --target ${{ matrix.target }}
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: cp rust/target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 1

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: switchboard-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: switchboard-*
          generate_release_notes: true
